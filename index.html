<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cyberspace-crt</title>
<style>
  /* No bezel is drawn: the shader lights the area around the tube itself. */
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: none;
  }

  /* Startup error. System font and a literal colour: no WebGL needed. */
  #fault {
    position: fixed;
    inset: 0;
    display: none;
    padding: 2rem;
    color: #ffb000;
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
  <canvas id="tube"></canvas>
  <pre id="fault"></pre>
  <script type="module" src="./main.js"></script>
</body>
</html>
